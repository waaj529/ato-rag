name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: fintaxglobal
  REGION: australia-southeast2
  SERVICE_NAME: fintaxgpt-rag
  REPOSITORY: fintax-images

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy Revision to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --port=8080
            --allow-unauthenticated
          env_vars: |
            FINTAX_DATABASE_URL=${{ secrets.FINTAX_DATABASE_URL }}
            ISAACUS_API_KEY=${{ secrets.ISAACUS_API_KEY }}
            FINTAX_CHAT_SERVICE_API_KEY=${{ secrets.FINTAX_CHAT_SERVICE_API_KEY }}
            FINTAX_LLM_API_KEY=${{ secrets.FINTAX_LLM_API_KEY }}
            FINTAX_LLM_PROVIDER=openai
            FINTAX_LLM_ENDPOINT=https://api.openai.com/v1/chat/completions
            FINTAX_LLM_MODEL=gpt-4o
            FINTAX_LLM_REVISION=gpt-4o
            FINTAX_TELEMETRY_EXPORTER=noop
